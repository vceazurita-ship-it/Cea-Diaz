# Análisis de seguridad del código con CodeQL, gratis en repositorios públicos.
#
# Busca los fallos de siempre —inyecciones, redirecciones abiertas en las
# rutas de /api, secretos que se cuelan al navegador— y los deja en la pestaña
# Security → Code scanning. No toca el despliegue: sólo avisa.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Una vez por semana, los lunes de madrugada, aunque no haya cambios:
    # las reglas de CodeQL se actualizan y pueden encontrar cosas nuevas.
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analizar:
    name: Analizar (javascript-typescript)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          # JavaScript no se compila para analizarse: basta con leer el código.
          build-mode: none
          queries: security-extended

      - uses: github/codeql-action/analyze@v4
        with:
          category: '/language:javascript-typescript'
