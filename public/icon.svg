<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Hábitos en Familia">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b202b"/>
      <stop offset="1" stop-color="#0f131b"/>
    </linearGradient>
    <linearGradient id="arc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.5" stop-color="#f472b6"/>
      <stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Anillo de progreso: el mismo gesto que preside cada panel -->
  <circle cx="256" cy="256" r="150" fill="none" stroke="#ffffff" stroke-opacity="0.10" stroke-width="34"/>
  <circle cx="256" cy="256" r="150" fill="none" stroke="url(#arc)" stroke-width="34"
          stroke-linecap="round" stroke-dasharray="707 943" transform="rotate(-90 256 256)"/>

  <!-- Marca de cumplido -->
  <path d="M196 262l42 42 86-92" fill="none" stroke="#eceef2" stroke-width="34"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
